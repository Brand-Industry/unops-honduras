        <style>
            :root{--bg:#f5f7fb;--card:#ffffff;--navy:#27314e;--mid:#65729c;--ink:#2e3440;--muted:#6b7385;--line:#d9dce3;--field:#eef1f6;--btn:#27314e;--btn-fg:#f0f7ff;color-scheme:light}
            @media (prefers-color-scheme:dark){:root{--bg:#141824;--card:#1b2030;--navy:#c9d3f0;--mid:#9aa8d4;--ink:#dfe3ec;--muted:#9aa2b4;--line:#2e3548;--field:#141824;--btn:#c9d3f0;--btn-fg:#141824;color-scheme:dark}}
            :root[data-theme="light"]{--bg:#f5f7fb;--card:#ffffff;--navy:#27314e;--mid:#65729c;--ink:#2e3440;--muted:#6b7385;--line:#d9dce3;--field:#eef1f6;--btn:#27314e;--btn-fg:#f0f7ff;color-scheme:light}
            :root[data-theme="dark"]{--bg:#141824;--card:#1b2030;--navy:#c9d3f0;--mid:#9aa8d4;--ink:#dfe3ec;--muted:#9aa2b4;--line:#2e3548;--field:#141824;--btn:#c9d3f0;--btn-fg:#141824;color-scheme:dark}
            .staticrypt-html{height:100%}
            .staticrypt-body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
            .staticrypt-content{min-height:100%;display:flex;flex-direction:column}
            .staticrypt-page{flex:1;display:grid;place-items:center;padding:32px 16px}
            .staticrypt-form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px;box-shadow:0 12px 40px rgba(20,24,36,.08)}
            .bi-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-family:"Montserrat",sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
            .bi-brand svg{width:32px;height:32px;border-radius:6px}
            .staticrypt-instructions p{margin:0}
            .staticrypt-title{font-family:"Montserrat",sans-serif;font-weight:700;font-size:22px;line-height:1.2;color:var(--navy);margin-bottom:6px!important}
            .staticrypt-instructions p+p{font-size:14px;color:var(--muted);margin-bottom:22px}
            .staticrypt-hr{display:none}
            .staticrypt-password-container{position:relative;background:var(--field);border:1px solid var(--line);border-radius:8px;margin:0 0 14px}
            .staticrypt-password-container:focus-within{border-color:var(--mid)}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{background:transparent;border:0;outline:0;width:100%;box-sizing:border-box;padding:13px 44px 13px 14px;font:16px "Inter",sans-serif;color:var(--ink)}
            .staticrypt-toggle-password-visibility{cursor:pointer;height:20px;width:20px;padding:12px;position:absolute;right:0;top:50%;transform:translateY(-50%);opacity:.55}
            @media (prefers-color-scheme:dark){.staticrypt-toggle-password-visibility{filter:invert(1)}}
            label.staticrypt-remember{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13.5px;color:var(--muted)}
            .staticrypt-remember input[type="checkbox"]{width:16px;height:16px;accent-color:var(--mid);margin:0}
            .staticrypt-form .staticrypt-decrypt-button{width:100%;border:0;border-radius:8px;padding:13px;background:var(--btn);color:var(--btn-fg);font:600 14px "Montserrat",sans-serif;letter-spacing:.03em;cursor:pointer}
            .staticrypt-form .staticrypt-decrypt-button:hover{filter:brightness(1.08)}
            .staticrypt-form .staticrypt-decrypt-button:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
            .bi-foot{text-align:center;font-size:12px;color:var(--muted);padding:0 16px 24px}
            .hidden{display:none!important}
            .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg)}
            .staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:.25em solid var(--mid);border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
            @keyframes spinner-border{100%{transform:rotate(360deg)}}
        </style>
